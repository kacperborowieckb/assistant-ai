name: Cleanup
description: Track deferred work with a testable completion condition.
title: "Cleanup: "
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Keep secrets and personal data out of this form.
  - type: textarea
    id: work
    attributes:
      label: Work to do
      description: Describe one cleanup task and link related files or PRs.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why it matters
      description: Explain the problem and why the work was deferred.
    validations:
      required: true
  - type: textarea
    id: ready-when
    attributes:
      label: Ready when
      description: State an observable condition and the command or evidence that will prove completion.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0: Current blocker"
        - "P1: Address this week"
        - "P2: After higher priorities"
        - "P3: With related work"
    validations:
      required: true
  - type: dropdown
    id: decision
    attributes:
      label: Owner decision
      options:
        - "No owner decision needed"
        - "needs-decision: State the question below"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Decision question
      description: If needed, state the choice the owner must make before work can proceed.
